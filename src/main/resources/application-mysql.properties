# Run with: mvn spring-boot:run -Dspring-boot.run.profiles=mysql
# Change the username/password to your own MySQL credentials (never commit real passwords).
spring.datasource.url=jdbc:mysql://localhost:3306/taskdb?createDatabaseIfNotExist=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=your_password

spring.h2.console.enabled=false
spring.jpa.hibernate.ddl-auto=update
